name: CI - Build, Test & Coverage

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "java-assignment/**"
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - "java-assignment/**"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Test & Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: java-assignment
        run: chmod +x ./mvnw

      - name: Build and run unit tests with JaCoCo coverage
        working-directory: java-assignment
        run: ./mvnw verify -Dquarkus.test.profile=test --no-transfer-progress
        # Note: Quarkus dev services automatically spin up a PostgreSQL container for tests.
        # No separate DB setup is needed. The JaCoCo check goal enforces >80% instruction coverage.

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/site/jacoco/
          retention-days: 14

      - name: Publish Test Results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: java-assignment/target/surefire-reports/*.xml
          comment_title: Unit Test Results

      - name: Check coverage threshold comment
        if: failure()
        run: |
          echo "::error::Code coverage is below the required 80% threshold. Please add more tests."

  # Optional: native build (slow, runs only on main)
  native-build:
    name: Native Image Build (optional)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up GraalVM native build tools
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm'

      - name: Make mvnw executable
        working-directory: java-assignment
        run: chmod +x ./mvnw

      - name: Build native image
        working-directory: java-assignment
        run: ./mvnw package -Pnative -Dquarkus.native.container-build=true --no-transfer-progress
