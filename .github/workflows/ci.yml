name: CI - Build, Test & Coverage

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "java-assignment/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - "java-assignment/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Test & Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: quarkus_test
          POSTGRES_PASSWORD: quarkus_test
          POSTGRES_DB: quarkus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: java-assignment
        run: chmod +x ./mvnw

      - name: Build and run unit tests with JaCoCo coverage
        working-directory: java-assignment
        run: >
          ./mvnw test
          -Dquarkus.datasource.db-kind=postgresql
          -Dquarkus.datasource.devservices.enabled=false
          -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus_test
          -Dquarkus.datasource.username=quarkus_test
          -Dquarkus.datasource.password=quarkus_test
          --no-transfer-progress

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/site/jacoco/
          retention-days: 14

      - name: Publish Test Results
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: java-assignment/target/surefire-reports/*.xml
          comment_title: Unit Test Results

      - name: Generate JaCoCo Coverage Summary
        if: always()
        working-directory: java-assignment
        run: |
          REPORT="target/site/jacoco/index.html"
          if [ -f "$REPORT" ]; then
            echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated at \`target/site/jacoco/index.html\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the **jacoco-coverage-report** artifact above to view full details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check coverage threshold comment
        if: failure()
        run: |
          echo "::error::Code coverage is below the required 80% threshold. Please add more tests."
          echo "## ❌ Coverage Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Instruction coverage is below the required **80%** minimum threshold." >> $GITHUB_STEP_SUMMARY
          echo "Please add more unit tests to increase coverage." >> $GITHUB_STEP_SUMMARY
